<text text-anchor="middle" dominant-baseline="central" fill="#111827" font-weight="600"><tspan x="0" y="0.0">🧭 La strada di un pacchetto</tspan></text>
<rect x="195.71281852263706" y="-332.6" width="192.41599999999997" height="57.6" rx="18" fill="#e4eefe" stroke="#3b82f6" stroke-width="2"/>
<text text-anchor="middle" dominant-baseline="central" fill="#1b3b6f" font-weight="600"><tspan x="291.9208185226371" y="-314.2">Il confine: prefisso e</tspan><tspan x="291.9208185226371" y="-293.4">sottoreti</tspan></text>
<text text-anchor="start" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="450.12881852263706" y="-396.2">✅ Prefisso: quanti bit sono</tspan><tspan x="450.12881852263706" y="-375.4">la rete</tspan></text>
<text text-anchor="start" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="450.12881852263706" y="-334.6">✅ Quanti indirizzi entrano</tspan><tspan x="450.12881852263706" y="-313.8">nel blocco</tspan></text>
<text text-anchor="start" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="450.12881852263706" y="-273.0">🔍 Rete e broadcast</tspan></text>
<text text-anchor="start" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="450.12881852263706" y="-232.2">🔍 Prefissi che</tspan><tspan x="450.12881852263706" y="-211.4">attraversano l'ottetto</tspan></text>
<rect x="195.71281852263706" y="-99.00000000000003" width="252.32000000000005" height="36.8" rx="18" fill="#fef1dd" stroke="#f59e0b" stroke-width="2"/>
<text text-anchor="middle" dominant-baseline="central" fill="#6e4705" font-weight="600"><tspan x="321.8728185226371" y="-80.6">Piano di indirizzi con più sedi</tspan></text>
<text text-anchor="start" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="510.0328185226371" y="-152.6">✅ VLSM: blocchi di misura</tspan><tspan x="510.0328185226371" y="-131.8">diversa</tspan></text>
<text text-anchor="start" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="510.0328185226371" y="-91.0">✅ Collegamento fra router:</tspan><tspan x="510.0328185226371" y="-70.2">rete /30</tspan></text>
<text text-anchor="start" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="510.0328185226371" y="-29.4">🔍 Allineamento: il blocco</tspan><tspan x="510.0328185226371" y="-8.6">parte da un confine giusto</tspan></text>
<rect x="195.71281852263706" y="124.19999999999999" width="134.176" height="36.8" rx="18" fill="#e0f7e8" stroke="#22c55e" stroke-width="2"/>
<text text-anchor="middle" dominant-baseline="central" fill="#0f592a" font-weight="600"><tspan x="262.8008185226371" y="142.6">Indirizzi IPv6</tspan></text>
<text text-anchor="start" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="391.88881852263705" y="50.2">✅ 128 bit, scritti in</tspan><tspan x="391.88881852263705" y="71.0">esadecimale</tspan></text>
<text text-anchor="start" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="391.88881852263705" y="111.8">✅ Compressione con due</tspan><tspan x="391.88881852263705" y="132.6">punti doppi</tspan></text>
<text text-anchor="start" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="391.88881852263705" y="173.4">🔍 Tipi di indirizzo</tspan><tspan x="391.88881852263705" y="194.2">riconoscibili</tspan></text>
<text text-anchor="start" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="391.88881852263705" y="235.0">🤓 Perché IPv4 si è esaurito</tspan></text>
<rect x="195.71281852263706" y="326.6" width="192.41599999999997" height="36.8" rx="18" fill="#fde5e5" stroke="#ef4444" stroke-width="2"/>
<text text-anchor="middle" dominant-baseline="central" fill="#6c1f1f" font-weight="600"><tspan x="291.9208185226371" y="345.0">La tabella del router</tspan></text>
<text text-anchor="start" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="450.12881852263706" y="293.8">✅ Riga della tabella</tspan></text>
<text text-anchor="start" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="450.12881852263706" y="334.6">✅ Rotta predefinita</tspan></text>
<text text-anchor="start" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="450.12881852263706" y="375.4">🔍 Scelta della riga: vince il</tspan><tspan x="450.12881852263706" y="396.2">prefisso più lungo</tspan></text>
<rect x="-391.45681852263704" y="-221.19999999999996" width="195.744" height="36.8" rx="18" fill="#efe8fe" stroke="#8b5cf6" stroke-width="2"/>
<text text-anchor="middle" dominant-baseline="central" fill="#3f296f" font-weight="600"><tspan x="-293.5848185226371" y="-202.8">Rotte scritte a mano</tspan></text>
<text text-anchor="end" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="-453.45681852263704" y="-264.4">✅ Rotta statica</tspan></text>
<text text-anchor="end" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="-453.45681852263704" y="-223.6">✅ Prossimo passo</tspan><tspan x="-453.45681852263704" y="-202.8">raggiungibile</tspan></text>
<text text-anchor="end" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="-453.45681852263704" y="-162.0">🔍 Default route come</tspan><tspan x="-453.45681852263704" y="-141.2">ultima risorsa</tspan></text>
<rect x="-441.3768185226371" y="-8.399999999999952" width="245.66400000000004" height="57.6" rx="18" fill="#def5f3" stroke="#14b8a6" stroke-width="2"/>
<text text-anchor="middle" dominant-baseline="central" fill="#09534b" font-weight="600"><tspan x="-318.5448185226371" y="10.0">Routing dinamico, solo come</tspan><tspan x="-318.5448185226371" y="30.8">introduzione</tspan></text>
<text text-anchor="end" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="-503.3768185226371" y="-82.4">✅ Perché serve: la tabella</tspan><tspan x="-503.3768185226371" y="-61.6">si aggiorna</tspan></text>
<text text-anchor="end" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="-503.3768185226371" y="-20.8">✅ Distance Vector:</tspan><tspan x="-503.3768185226371" y="0.0">passaparola fra vicini</tspan></text>
<text text-anchor="end" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="-503.3768185226371" y="40.8">✅ Link State: mappa</tspan><tspan x="-503.3768185226371" y="61.6">completa dei collegamenti</tspan></text>
<text text-anchor="end" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="-503.3768185226371" y="102.4">🤓 RIP e OSPF, solo come</tspan><tspan x="-503.3768185226371" y="123.2">nomi</tspan></text>
<rect x="-373.15281852263706" y="204.8" width="177.44" height="36.8" rx="18" fill="#fce5f1" stroke="#ec4899" stroke-width="2"/>
<text text-anchor="middle" dominant-baseline="central" fill="#6a2045" font-weight="600"><tspan x="-284.43281852263704" y="223.2">Ripasso e recupero</tspan></text>
<text text-anchor="end" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="-435.15281852263706" y="182.0">✅ 🔁 Esercizi mescolati,</tspan><tspan x="-435.15281852263706" y="202.8">graduati</tspan></text>
<text text-anchor="end" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="-435.15281852263706" y="243.6">✅ 🩹 Dove riprendere,</tspan><tspan x="-435.15281852263706" y="264.4">errore per errore</tspan></text>
