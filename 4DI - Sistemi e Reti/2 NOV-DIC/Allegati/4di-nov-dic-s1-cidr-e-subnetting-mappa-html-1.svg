<text text-anchor="start" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="452.3046042723779" y="-92.4">✅ Indirizzo, bit, ottetto,</tspan><tspan x="452.3046042723779" y="-71.6">prefisso</tspan></text>
