<text text-anchor="start" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="480.5926042723779" y="28.0">✅ Rete e broadcast</tspan><tspan x="480.5926042723779" y="48.8">chiudono il blocco</tspan></text>
<text text-anchor="start" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="480.5926042723779" y="89.6">🔍 Il salto trova il blocco di</tspan><tspan x="480.5926042723779" y="110.4">un indirizzo</tspan></text>
