<text text-anchor="end" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="-450.6406042723779" y="52.8">✅ Un blocco contiene l'altro</tspan><tspan x="-450.6406042723779" y="73.6">se ne sta dentro</tspan></text>
<text text-anchor="end" dominant-baseline="central" fill="#1f2937" font-weight="400"><tspan x="-450.6406042723779" y="114.4">🔍 Più reti contigue</tspan><tspan x="-450.6406042723779" y="135.2">diventano una sola riga</tspan></text>
