  <path d="M468 274 L477 276 L473 285" fill="none" stroke="#d16f45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="450" y="316" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6b6470">Schema concettuale, non mappa geografica</text>
